name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.22.0
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm dist
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: bash scripts/smoke-appimage.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb --verify-tag --generate-notes
